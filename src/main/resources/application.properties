spring.application.name=Casa_Dragones

# Configuración de base de datos MySQL (variables de entorno con valores por defecto)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/casa_dragon?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USER:casa_dragon_andres}
spring.datasource.password=${DB_PASSWORD:Dragon_Andres*}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración del pool HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.pool-name=HikariCP-CasaDragones
